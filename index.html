<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sharelox &ndash; Shared data, unlocked.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
    }

    #hero {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #e6edf3;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      padding: 0 1.5rem;
      max-width: 760px;
    }

    #brand {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    #brand .share {
      color: #ffffff;
    }

    #brand .lox {
      color: #88c6ff;
    }

    #slogan {
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #e6edf3;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    #description {
      font-size: clamp(0.9rem, 1.5vw, 1.05rem);
      font-weight: 400;
      line-height: 1.65;
      color: #c9d1d9;
      max-width: 560px;
      margin: 0 auto;
      opacity: 0.85;
    }

    #description strong {
      color: #e6edf3;
      font-weight: 500;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #footer {
      position: absolute;
      bottom: 1rem;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      font-size: 0.85rem;
      color: #8b949e;
      letter-spacing: 0.05em;
    }

    #footer a {
      color: #8b949e;
      text-decoration: none;
      margin: 0 0.75rem;
      transition: color 0.2s ease;
    }

    #footer a:hover {
      color: #e6edf3;
    }
  </style>
</head>
<body>
  <div id="hero">
    <div id="brand"><span class="share">share</span><span class="lox">lox</span></div>
    <div id="slogan">Shared data, unlocked.</div>
    <p id="description">
      Die Plattform f&uuml;r <strong>Teams, die ihre Daten gemeinsam verwalten</strong> &ndash;
      erstellen, bearbeiten, teilen, auswerten. Darauf entstehen ma&szlig;geschneiderte Apps
      f&uuml;r Ihre Organisation, vom Vereinsmanagement bis zum
      Kunden-spezifischen Einsatzwerkzeug.
    </p>
  </div>
  <canvas id="canvas"></canvas>
  <div id="footer">
    <a href="impressum.html">Impressum</a>
    <span>&middot;</span>
    <a href="https://www.renauer.at/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      let width = 0;
      let height = 0;
      let dpr = Math.max(1, window.devicePixelRatio || 1);

      function resize() {
        dpr = Math.max(1, window.devicePixelRatio || 1);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
      }
      resize();
      window.addEventListener('resize', resize);

      var phases = {
        x: [Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2],
        y: [Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2],
      };
      var freqs = {
        x: [0.071, 0.137, 0.233, 0.389],
        y: [0.059, 0.113, 0.211, 0.347],
      };
      var weights = [0.55, 0.28, 0.12, 0.05];

      function pointAt(t) {
        var nx = 0, ny = 0;
        for (var i = 0; i < 4; i++) {
          nx += Math.sin(freqs.x[i] * 2 * Math.PI * t + phases.x[i]) * weights[i];
          ny += Math.sin(freqs.y[i] * 2 * Math.PI * t + phases.y[i]) * weights[i];
        }
        var marginX = Math.min(80, width * 0.06);
        var marginY = Math.min(80, height * 0.06);
        return {
          x: width / 2 + nx * (width / 2 - marginX),
          y: height / 2 + ny * (height / 2 - marginY),
        };
      }

      var lastTime = performance.now();
      var simTime = Math.random() * 1000;

      function frame(now) {
        var dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        simTime += dt;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.045)';
        ctx.fillRect(0, 0, width, height);

        var tip = pointAt(simTime);

        ctx.fillStyle = '#88c6ff';
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 3, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(function (t) {
        lastTime = t;
        frame(t);
      });
    })();
  </script>
</body>
</html>

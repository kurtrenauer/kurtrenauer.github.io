<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sharelox &ndash; Shared data, unlocked.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #0d1117;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
    }

    #hero {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #e6edf3;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      padding: 0 1.5rem;
      max-width: 760px;
    }

    #brand {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    #brand .share {
      color: #ffffff;
    }

    #brand .lox {
      color: #88c6ff;
    }

    #slogan {
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #e6edf3;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    #description {
      font-size: clamp(0.9rem, 1.5vw, 1.05rem);
      font-weight: 400;
      line-height: 1.65;
      color: #c9d1d9;
      max-width: 560px;
      margin: 0 auto;
      opacity: 0.85;
    }

    #description strong {
      color: #e6edf3;
      font-weight: 500;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    #footer {
      position: absolute;
      bottom: 1rem;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      font-size: 0.85rem;
      color: #8b949e;
      letter-spacing: 0.05em;
    }

    #footer a {
      color: #8b949e;
      text-decoration: none;
      margin: 0 0.75rem;
      transition: color 0.2s ease;
    }

    #footer a:hover {
      color: #e6edf3;
    }
  </style>
</head>
<body>
  <div id="hero">
    <div id="brand"><span class="share">share</span><span class="lox">lox</span></div>
    <div id="slogan">Shared data, unlocked.</div>
    <p id="description">
      Die Plattform f&uuml;r <strong>Teams, die ihre Daten gemeinsam verwalten</strong> &ndash;
      erstellen, bearbeiten, teilen, auswerten. Darauf entstehen ma&szlig;geschneiderte Apps
      f&uuml;r Ihre Organisation, vom Vereinsmanagement bis zum
      Kunden-spezifischen Einsatzwerkzeug.
    </p>
  </div>
  <canvas id="canvas"></canvas>
  <div id="footer">
    <a href="impressum.html">Impressum</a>
    <span>&middot;</span>
    <a href="https://www.renauer.at/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    resize();
    window.addEventListener('resize', resize);

    let phase = 0;

    function draw() {
      ctx.clearRect(0, 0, width, height);

      const midY = height / 2;
      const amp1 = height * 0.12;
      const amp2 = height * 0.06;
      const freq1 = (2 * Math.PI) / width * 2;
      const freq2 = (2 * Math.PI) / width * 5;

      ctx.save();
      ctx.shadowColor = 'rgba(136, 198, 255, 0.6)';
      ctx.shadowBlur = 20;
      ctx.strokeStyle = '#88c6ff';
      ctx.lineWidth = 2;
      ctx.beginPath();

      for (let x = 0; x <= width; x++) {
        const y = midY
          + amp1 * Math.sin(freq1 * x + phase)
          + amp2 * Math.sin(freq2 * x + phase * 1.7);

        if (x === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();
      ctx.restore();

      phase += 0.02;
      if (phase >= 2 * Math.PI) phase -= 2 * Math.PI;

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
